<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Pixels</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
<style>

:root{--h:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--muted:hsl(var(--h) 20% 68%);--pur:hsl(var(--h) 70% 68%);--g:#22c55e;--y:#eab308;--x:hsl(var(--h) 14% 42%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 8px;font-family:"Rubik Doodle Shadow","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9.5vw,44px);letter-spacing:1px;line-height:1.1}
.sub{margin:0 0 12px;color:var(--muted);font-size:18px}
.lg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:15.5px;margin:0 0 10px;text-align:center;color:var(--muted);background:var(--panel);padding:10px;border-radius:12px;line-height:1.3}
.lg div{border-top:4px solid;padding-top:6px}
.lg b{display:block;color:var(--ink);font-size:17px}
button{font:inherit;font-weight:600;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#msg{min-height:26px;font-weight:600;margin:6px 0 10px}
.hid{position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;opacity:0;pointer-events:none}
.g{--c:max(4px,min(11px,calc(((100vw - 40px - (var(--n,5) - 1) * 8px) / var(--n,5) - 14px) / 5)));display:grid;grid-template-columns:repeat(5,var(--c));grid-auto-rows:var(--c);gap:1px;padding:5px;border-radius:6px;background:var(--panel)}
.g i{display:block;border-radius:1px;background:hsl(var(--h) 20% 24%)}
.g i.unk{background:var(--x)}
.g i.gre{background:var(--g)}
.g i.red{background:#ef4444}
.g i.pur{background:var(--pur)}
.g i.typ{background:var(--ink)}
#board{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
.ref{display:flex;flex-direction:column;gap:8px;align-items:center;margin:0 0 12px}
.ref .line{display:flex;gap:4px;justify-content:center}
.ref .rl.used{opacity:.4}
.ref .g{--c:max(2px,min(4.4px,calc((100vw - 190px) / 65)));padding:2px}
.ref .g i.lit{background:var(--ink)}
.hist .word{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.acts{display:flex;gap:10px;justify-content:center;margin-top:14px}
.acts button{padding:10px 18px;border-radius:8px;background:transparent;color:var(--ink);border:2px solid var(--muted)}
.acts button:disabled{opacity:.4;cursor:not-allowed}
.win{background:var(--pur);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:pop .5s ease-out;word-break:break-word}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (min-width:800px){
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
.lg{font-size:21px;padding:14px;gap:14px}
.lg b{font-size:24px}
.win{font-size:30px;max-width:620px}
#msg{min-height:40px}
.g{--c:15px}
.ref .g{--c:9px}
.acts button{padding:14px 30px}
}
</style></head><body>
<main>
<h1>Word Pixels</h1>
<p class="sub">Every letter is made of pixels. Type a word and use the pixel clues to find the secret word.</p>
<div class="lg"><div style="border-color:var(--pur)"><b>Purple</b>letter is right</div><div style="border-color:var(--g)"><b>Green</b>pixel is in this spot</div><div style="border-color:#ef4444"><b>Red</b>pixel is not in this spot</div><div style="border-color:var(--x)"><b>Gray</b>unknown for now</div></div>
<div class="ref" id="ref" aria-label="Pixel alphabet reference"></div>
<div id="msg" role="status"></div>
<div id="board" aria-label="Secret word"></div>
<input id="g" class="hid" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" aria-label="Type your guess">
<div class="hist" id="hist"></div>
<div class="acts"><button id="nb">New game</button><button id="give">Give up</button></div>
</main>
<script>
const SRC={A:"01110,10001,10001,11111,10001,10001,10001",B:"11110,10001,10001,11110,10001,10001,11110",C:"01110,10001,10000,10000,10000,10001,01110",D:"11110,10001,10001,10001,10001,10001,11110",E:"11111,10000,10000,11110,10000,10000,11111",F:"11111,10000,10000,11110,10000,10000,10000",G:"01110,10001,10000,10111,10001,10001,01111",H:"10001,10001,10001,11111,10001,10001,10001",I:"01110,00100,00100,00100,00100,00100,01110",J:"00111,00010,00010,00010,00010,10010,01100",K:"10001,10010,10100,11000,10100,10010,10001",L:"10000,10000,10000,10000,10000,10000,11111",M:"10001,11011,10101,10101,10001,10001,10001",N:"10001,11001,10101,10011,10001,10001,10001",O:"01110,10001,10001,10001,10001,10001,01110",P:"11110,10001,10001,11110,10000,10000,10000",Q:"01110,10001,10001,10001,10101,10010,01101",R:"11110,10001,10001,11110,10100,10010,10001",S:"01111,10000,10000,01110,00001,00001,11110",T:"11111,00100,00100,00100,00100,00100,00100",U:"10001,10001,10001,10001,10001,10001,01110",V:"10001,10001,10001,10001,10001,01010,00100",W:"10001,10001,10001,10101,10101,10101,01010",X:"10001,10001,01010,00100,01010,10001,10001",Y:"10001,10001,01010,00100,00100,00100,00100",Z:"11111,00001,00010,00100,01000,10000,11111"};
const FONT={};for(const k in SRC)FONT[k]=SRC[k].split(",").map(r=>[...r].map(c=>c==="1"));
const WORDS={},OK=new Set();
function getList(url){return fetch(url).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){return t.split(/\s+/).filter(Boolean)})}
function prep(a,g){for(let n=3;n<=7;n++)WORDS[n]=[];
 a.forEach(w=>{if(w.length>=3&&w.length<=7)WORDS[w.length].push(w)});
 g.forEach(w=>{if(w.length>=3&&w.length<=7)OK.add(w.toLowerCase())})}
const $=id=>document.getElementById(id);
const gi=$("g");
let secret,n,st,solved,wrong,over,nextT,cur="",winner="",usedL=new Set();
function grid(fn){let h='<div class="g">';for(let r=0;r<7;r++)for(let c=0;c<5;c++)h+=`<i class="${fn(r,c)}"></i>`;return h+"</div>"}
$("ref").innerHTML=["ABCDEFGHIJKLM","NOPQRSTUVWXYZ"].map(l=>`<div class="line">${[...l].map(ch=>`<span class="rl" data-l="${ch}">${grid((r,c)=>FONT[ch][r][c]?"lit":"")}</span>`).join("")}</div>`).join("");
function msg(t){$("msg").textContent=t}
function drawBoard(){
  $("board").innerHTML=[...secret].map((ch,i)=>grid((r,c)=>{
    if(solved[i]||over)return FONT[ch][r][c]?"pur":"";
    if(i<cur.length)return FONT[cur[i].toUpperCase()][r][c]?"typ":"";
    return ["unk","gre","red"][st[i][r*5+c]];
  })).join("");
}
function guessRow(w){
  return `<div class="word">${[...w].map((ch,i)=>{
    const ok=ch===secret[i];
    return grid((r,c)=>{
      if(!FONT[ch][r][c])return "";
      if(ok)return "pur";
      const has=FONT[secret[i]][r][c];
      st[i][r*5+c]=has?1:2;
      return has?"gre":"red";
    });
  }).join("")}</div>`;
}
function marks(){document.querySelectorAll(".rl").forEach(e=>e.classList.toggle("used",usedL.has(e.dataset.l)))}
function start(){window.newRound&&window.newRound();
  clearTimeout(nextT);
  n=3+Math.floor(Math.random()*5);document.documentElement.style.setProperty("--n",n);
  const list=WORDS[n];secret=list[Math.floor(Math.random()*list.length)];OK.add(secret.toLowerCase());
  st=Array.from({length:n},()=>Array(35).fill(0));solved=Array(n).fill(false);wrong=Array.from({length:n},()=>new Set());over=false;winner="";usedL=new Set();
  $("hist").innerHTML="";cur="";gi.value="";gi.maxLength=n;gi.disabled=false;$("give").disabled=false;
  marks();msg("");drawBoard();gi.focus({preventScroll:true});
}
function fits(w){
  for(let i=0;i<n;i++){const ch=w[i];
    if(solved[i]){if(ch!==secret[i])return false;continue}
    if(wrong[i].has(ch))return false;
    for(let p=0;p<35;p++){const lit=FONT[ch][(p/5)|0][p%5];
      if(st[i][p]===1&&!lit)return false;
      if(st[i][p]===2&&lit)return false}}
  return true}
function submit(){
  if(over)return;
  if(cur.length<n){msg("Need "+n+" letters.");return}
  const w=cur.toUpperCase();
  if(!OK.has(cur)){msg(w+" is not a valid word.");return}
  if(!fits(w)){msg(w+" does not fit the tiles.");return}
  $("hist").insertAdjacentHTML("afterbegin",guessRow(w));
  [...w].forEach(ch=>usedL.add(ch));marks();
  for(let i=0;i<n;i++){if(w[i]===secret[i])solved[i]=true;else wrong[i].add(w[i])}
  cur="";gi.value="";
  window.scoreGuess&&window.scoreGuess(winner,"Word Pixels",solved.every(Boolean));
  if(solved.every(Boolean)){over=true;gi.disabled=true;$("give").disabled=true;msg("");drawBoard();popup();confetti()}
  else{msg("");drawBoard()}
}
function popup(){if(window.WinnerCard&&WinnerCard.show({game:"Word Pixels",name:winner,word:secret,points:5})){nextT=setTimeout(start,WinnerCard.total()+300);return}let nm=winner;try{nm=nm||(new URLSearchParams(location.search).get('name')||window.playerName||'').trim().slice(0,30)}catch(e){}
  const d=document.createElement('div');d.className='win';d.textContent=(nm||'Player')+' won with \u2018'+secret+'\u2019';const m=$("msg");m.textContent='';m.appendChild(d);
  nextT=setTimeout(start,6000)}
function remote(word,name){if(over)return;word=String(word||'').trim().toLowerCase();if(!/^[a-z]+$/.test(word)||word.length!==n)return;cur=word;winner=String(name||'').trim().slice(0,30);submit();winner=''}
window.submitGuess=remote;
window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='guess')remote(d.word,d.name)});
const LIVE=/[?&]live=1/.test(location.search)||location.protocol==='file:';
function tikfinity(){let ws;try{ws=new WebSocket('ws://127.0.0.1:21213/')}catch(e){return}
 ws.onmessage=ev=>{try{const m=JSON.parse(ev.data),d=m.data||m;if(!/chat|comment/i.test(String(m.event||m.type||'')))return;const u=d.user||{};remote(d.comment||d.text||d.message,d.nickname||d.uniqueId||u.nickname||u.uniqueId)}catch(e){}};
 ws.onclose=()=>setTimeout(tikfinity,3000);ws.onerror=()=>ws.close()}
if(LIVE)tikfinity();
gi.addEventListener('input',()=>{if(over)return;gi.value=gi.value.replace(/[^a-z]/gi,'').toLowerCase();cur=gi.value;drawBoard()});
gi.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
$("board").addEventListener('click',()=>{if(!over)gi.focus()});
document.addEventListener('keydown',e=>{if(!over&&document.activeElement.tagName!=='INPUT'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key.length===1||e.key==='Enter'||e.key==='Backspace'))gi.focus()});
$("nb").onclick=start;
$("give").onclick=()=>{if(over)return;over=true;gi.disabled=true;$("give").disabled=true;cur="";msg("You gave up. The word was "+secret+".");drawBoard()};
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();
  })();
}
msg("Loading words...");
Promise.all([getList("../answers.txt"),getList("../guesses.txt")]).then(function(r){prep(r[0],r[1]);start()}).catch(function(){msg("Could not load the word lists.")});
</script>
<script src="../back-to-menu.js"></script>
<script src="../live-comments.js"></script></body></html>
