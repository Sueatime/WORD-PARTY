<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Word Party Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #14122b;
      --card: #211e45;
      --ink: #f3f1ff;
      --mu: #a9a5d1;

      /* ===== VOTE BOX SIZE: EDIT THESE NUMBERS =====
         --vote-width : how wide the vote box is on the screen (94% = almost full width)
         --card-h     : height of each game box. Bigger numbers = taller boxes.
                        Example: clamp(104px, min(27vw, 15.5vh), 160px) means "27% of the screen
                        width, but never more than 15.5% of the screen height, and between 104px and 160px"
         --name-scale : size of the game name (1 = normal, 1.2 = 20% bigger, 0.9 = smaller)
         --icon-scale : size of the icon
         --pct-scale  : size of the percentage                                              */
      --vote-width: 97%;
      --card-h: clamp(111px, min(28vw, 16vh), 160px);
      --name-scale: 1.2;
      --icon-scale: 1.3;
      --pct-scale: 1.3
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Fredoka", system-ui, sans-serif;
      overflow: hidden
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    #bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      font-size: 22px;
      font-weight: 600;
      flex: none
    }

    #bar .live {
      background: #e11d48;
      border-radius: 8px;
      padding: 2px 10px;
      font-size: 16px;
      font-weight: 700
    }

    #bar .guide {
      color: #c9b3ff;
      font-size: 20px;
      text-align: center;
      flex: 1
    }

    #bar .rd {
      background: #332e66;
      border-radius: 99px;
      padding: 2px 14px;
      font-size: 18px
    }

    #wrap {
      position: relative;
      flex: 1;
      min-height: 0
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg)
    }

    #ov {
      position: absolute;
      inset: 0;
      background: rgba(20, 18, 43, .8);
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: clamp(52px, 6.5vh, 84px) 14px 14px;
      overflow: hidden
    }

    #ov[hidden] {
      display: none
    }

    #pn {
      width: var(--vote-width);
      max-width: 560px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-height: 0
    }

    #pn h2 {
      flex: none;
      margin: 0 0 clamp(4px, 1vh, 14px);
      text-align: center;
      font-size: clamp(18px, min(3.8vh, 6vw), 32px);
      font-weight: 700;
      color: #fff;
      background: #a46bff;
      border-radius: clamp(12px, 2vh, 18px);
      padding: clamp(5px, 1.1vh, 14px) 10px
    }

    .grid {
      --gp: clamp(4px, .8vh, 8px);
      flex: none;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: var(--card-h);
      gap: var(--gp)
    }

    .g {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: var(--card);
      border-bottom: clamp(3px, .6vh, 6px) solid var(--a);
      border-radius: clamp(12px, 2vh, 18px);
      padding: clamp(3px, .8vh, 14px) 6px clamp(3px, .6vh, 10px);
      font-weight: 600;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1px, .4vh, 6px)
    }

    .g .ic {
      flex: none;
      width: clamp(26px, min(5.6vh, 11vw), 60px);
      height: clamp(26px, min(5.6vh, 11vw), 60px);
      border-radius: clamp(8px, 1.5vh, 16px);
      background: var(--a);
      display: grid;
      place-items: center;
      font-size: clamp(16px, min(3.2vh, 6vw), 34px)
    }

    .g b {
      font-size: clamp(11px, min(2.3vh, 4.2vw), 22px);
      line-height: 1.1
    }

    .g .pr {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px
    }

    .g .pc {
      font-size: clamp(16px, min(3.4vh, 6vw), 32px);
      font-weight: 700;
      line-height: 1
    }

    .g em {
      font-style: normal;
      font-size: clamp(10px, min(1.8vh, 3.2vw), 16px);
      opacity: .85
    }

    .g.lead {
      outline: 3px solid #fff;
      outline-offset: -3px
    }

    .g small {
      position: absolute;
      top: clamp(3px, .7vh, 8px);
      left: clamp(3px, .7vh, 8px);
      width: clamp(20px, min(3.6vh, 6vw), 36px);
      height: clamp(20px, min(3.6vh, 6vw), 36px);
      border-radius: 50%;
      border: 2.5px solid #fff;
      display: grid;
      place-items: center;
      font-size: clamp(12px, min(2.1vh, 3.8vw), 20px);
      font-weight: 700
    }

    /* Size everything inside a card from the card itself (not the screen), so the icon,
       text and card always stay in proportion on any phone, in desktop mode, or in a tall view.
       Browsers without container query units keep the vh/vw sizes above. */
    @supports (width: 1cqmin) {
      .g {
        container-type: size
      }

      .g .ic {
        width: calc(clamp(26px, 38cqmin, 76px) * var(--icon-scale));
        height: calc(clamp(26px, 38cqmin, 76px) * var(--icon-scale));
        border-radius: clamp(8px, 8cqmin, 18px);
        font-size: calc(clamp(16px, 21cqmin, 40px) * var(--icon-scale))
      }

      .g b {
        font-size: calc(clamp(12px, min(16cqmin, 9.5cqw), 28px) * var(--name-scale))
      }

      .g .pc {
        font-size: calc(clamp(16px, min(17cqmin, 11cqw), 34px) * var(--pct-scale))
      }

      .g em {
        font-size: clamp(10px, min(9.5cqmin, 6.5cqw), 17px)
      }

      .g small {
        width: clamp(20px, 18cqmin, 34px);
        height: clamp(20px, 18cqmin, 34px);
        font-size: clamp(12px, 10.5cqmin, 20px)
      }
    }

    #cd {
      flex: none;
      text-align: center;
      font-size: clamp(18px, min(3.6vh, 6vw), 32px);
      font-weight: 700;
      margin-top: clamp(4px, 1vh, 12px)
    }

    #hint {
      flex: none;
      text-align: center;
      color: var(--mu);
      font-size: clamp(12px, min(1.9vh, 3.6vw), 18px);
      margin-top: 2px
    }

    #wait {
      padding: 40px;
      text-align: center;
      color: var(--mu);
      font-size: 24px
    }

    @media(max-width:560px) {
      #bar {
        font-size: 18px
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="bar"><span class="live">LIVE</span><span id="gm"></span><span class="guide" id="gd"></span><span class="rd"
        id="rd"></span></div>
    <div id="wrap">
      <div id="wait">Waiting for the host to start…</div>
      <iframe id="fr" title="Game" hidden></iframe>
      <div id="ov" hidden>
        <div id="pn">
          <h2>Vote for the next game</h2>
          <div class="grid" id="gr"></div>
          <div id="cd"></div>
          <div id="hint"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="live-config.js"></script>
  <script>
    var $ = function (i) { return document.getElementById(i) }, S = null, cur = "", EXP = "", shown = "", inMenu = false, lastHint = null;
    function poll() {
      getState().then(function (s) {
        if (!s || !s.game) return;
        var key = s.game + "|" + s.round;
        if (key !== cur) { cur = key; EXP = slug(s.game); shown = s.game; inMenu = false; $("fr").src = EXP + "/"; $("fr").hidden = false; $("wait").hidden = true }
        S = s; draw();
        if (typeof s.hint_count === "number") {
          if (lastHint === null) lastHint = s.hint_count;
          else if (s.hint_count > lastHint) {
            lastHint = s.hint_count;
            try { $("fr").contentWindow.postMessage({ type: "wp_hint" }, "*") } catch (e) { }
          }
        }
      }).catch(function () { });
    }
    function draw() {
      var sg = shown || S.game; $("gm").textContent = inMenu ? "\uD83C\uDFE0 Choose a game" : ic(sg) + " " + sg;

      var g = S.guide ? "Type your guess in the chat!" : "";
      if (g && S.play_who && S.play_who !== "all") g += " (" + SHORT[S.play_who] + " only)";
      $("gd").textContent = g;
      var voting = !!S.vote_ends_at;
      $("ov").hidden = !voting;
      if (voting) {
        var tot = 0; S.votes.forEach(function (v) { tot += v }); tot = tot || 1; var mx = Math.max.apply(null, S.votes);
        $("gr").innerHTML = (S.options || []).map(function (o, i) {
          return '<div class="g' + (mx > 0 && S.votes[i] === mx ? ' lead' : '') + '" style="--a:' + acc(o) + '"><small>' + (i + 1) + '</small><div class="ic">' + ic(o) + '</div><b>' + o + '</b><div class="pr"><strong class="pc">' + Math.round(S.votes[i] / tot * 100) + '%</strong><em>' + S.votes[i] + ' votes</em></div></div>';
        }).join("");
        $("hint").textContent = "Type 1 to 8 in the chat to vote" + ((S.vote_who && S.vote_who !== "all") ? " (" + SHORT[S.vote_who] + " only)" : "");
      }
    }
    function tick() {
      if (!S) return;
      var n = Date.now(), e = S.vote_ends_at ? new Date(S.vote_ends_at).getTime() : 0, d = S.next_vote_at ? new Date(S.next_vote_at).getTime() : 0;
      if (e) { var t = fmt(e - n); $("cd").textContent = "Voting ends in " + t; $("rd").textContent = "Voting " + t }
      else if (d && n >= d) $("rd").textContent = "Vote after this round";
      else if (d) $("rd").textContent = "Next vote in " + fmt(d - n);
    }
    // The menu button inside the game works. A game picked from the menu becomes the live game
    // and the vote countdown starts again from that moment.
    function chooseGame(name) {
      var code = null; try { code = localStorage.getItem("wp_code") } catch (e) { }
      if (!code || !S || S.vote_ends_at) return;
      var old = cur, rd = (Number(S.round) || 0) + 1, im = Number(S.interval_min) || 20;
      cur = name + "|" + rd;
      rpc("set_state", { code: code, patch: { game: name, round: rd, next_vote_at: new Date(Date.now() + im * 60000).toISOString(), log: "Game chosen from the menu: " + name } })
        .then(function (ok) { if (ok !== true) cur = old }).catch(function () { cur = old });
    }
    $("fr").addEventListener("load", function () {
      hookGame();
      try {
        var w = $("fr").contentWindow;
        if (w.location.href === "about:blank") return;
        var p = w.location.pathname.split("/").filter(Boolean);
        var f = /\./.test(p[p.length - 1] || "") ? p[p.length - 2] : p[p.length - 1];
        var name = ""; for (var i = 0; i < MENU.length; i++)if (MENU[i][2] === f) name = MENU[i][0];
        if (!name) { inMenu = true; if (S) draw(); return }
        inMenu = false; shown = name;
        if (S && name !== S.game) chooseGame(name);
        if (S) draw();
      } catch (e) { }
    });
    // ---- Open the next-game vote right after the winner card and leaderboard screens ----
    // The game page shows the winner card and starts its next round after the card is finished.
    // We watch for that win here, wait the same time, and then open the vote (if one is due).
    var winTimer = null;
    function onWin(ms) {
      if (winTimer) clearTimeout(winTimer);
      winTimer = setTimeout(fireVote, ms);
    }
    function fireVote() {
      winTimer = null;
      var code = null; try { code = localStorage.getItem("wp_code") } catch (e) { }
      if (!code) return;
      getState().then(function (s) {
        if (!s || s.vote_ends_at) return;
        if (!(s.next_vote_at && new Date(s.next_vote_at).getTime() <= Date.now())) return;
        var names = MENU.map(function (m) { return m[0] }).filter(function (n) { return n !== s.game }).sort(function () { return Math.random() - .5 }).slice(0, 8);
        var secs = Number(s.vote_secs) || 35;
        return rpc("set_state", { code: code, patch: { options: names, votes: [0, 0, 0, 0, 0, 0, 0, 0], vote_ends_at: new Date(Date.now() + secs * 1000).toISOString(), log: "Vote opened after the leaderboard screens" } });
      }).catch(function () { });
    }
    function hookGame() {
      var w, tries = 0;
      try { w = $("fr").contentWindow; void w.location.href } catch (e) { return }
      var iv = setInterval(function () {
        tries++;
        try {
          if (w.WinnerCard && typeof w.WinnerCard.show === "function" && !w.WinnerCard.__wp) {
            w.WinnerCard.__wp = true;
            var os = w.WinnerCard.show;
            w.WinnerCard.show = function () {
              var r = os.apply(this, arguments);
              if (r) onWin((typeof w.WinnerCard.total === "function" ? Number(w.WinnerCard.total(arguments[0] && arguments[0].slow)) || 6000 : 6000) + 600);
              return r;
            };
          }
          if (typeof w.sendScore === "function" && !w.sendScore.__wp) {
            var oss = w.sendScore;
            w.sendScore = function (u, g, p, win) {
              if (win === true) setTimeout(function () { if (!winTimer) onWin(7000) }, 1500);
              return oss.apply(this, arguments);
            };
            w.sendScore.__wp = true;
          }
        } catch (e) { }
        if (tries > 40) clearInterval(iv);
      }, 400);
      // A player's own win has no viewer name, so the game shows a plain purple "won with" bar
      // instead of the winner card. Watch for that bar too.
      try {
        var body = w.document.body;
        if (body && !w.__wpObs) {
          w.__wpObs = true;
          var mo = new w.MutationObserver(function (muts) {
            if (winTimer) return;
            for (var i = 0; i < muts.length; i++) {
              var ad = muts[i].addedNodes;
              for (var j = 0; j < ad.length; j++) {
                var n = ad[j];
                if (n.nodeType === 1 && ((n.classList && n.classList.contains("win")) || (n.querySelector && n.querySelector(".win")))) { onWin(6800); return }
              }
            }
          });
          mo.observe(body, { childList: true, subtree: true });
        }
      } catch (e) { }
    }

    poll(); setInterval(poll, 1500); setInterval(tick, 500);
  </script>
</body>

</html>
