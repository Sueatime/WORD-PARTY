<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Tangle</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
<style>
:root{--h:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--mute:hsl(var(--h) 20% 68%);--pur:hsl(var(--h) 70% 68%);--g:#22c55e;--y:#eab308;--x:hsl(var(--h) 14% 42%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center;display:flex;flex-direction:column;min-height:100vh}
h1{margin:0 0 8px;font-family:"Rubik Doodle Shadow","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9.5vw,44px);letter-spacing:1px;line-height:1.1}
.sub{margin:0 0 12px;color:var(--mute);font-size:18px;text-align:center}
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:15.5px;margin:0 0 10px;text-align:center;color:var(--mute);background:var(--panel);padding:10px;border-radius:12px;line-height:1.3}
.lg div{border-top:4px solid;padding-top:6px}
.lg b{display:block;color:var(--ink);font-size:17px}
.panel{width:100%;margin:0 auto 12px}
.abc{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.k{display:flex;align-items:center;justify-content:center;border:2px solid var(--panel);border-radius:8px;height:36px;font-weight:700;color:var(--ink);background:var(--panel)}
.k.us{background:hsl(var(--h) 22% 40%);border-color:hsl(var(--h) 22% 40%)}
.row{display:flex;gap:5px;justify-content:center;margin-bottom:5px;align-items:center}
.tile{--s:min(var(--cap,40px),calc((100vw - 48px - (var(--n) - 1) * 5px) / var(--n)));width:var(--s);height:var(--s);border:2px solid var(--mute);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s) * .5);font-weight:700;text-transform:uppercase;color:var(--ink);background:var(--panel);padding:0;border-radius:8px}
.tile.cur{border-color:var(--pur)}
.tile.gr{background:var(--g);border-color:var(--g);color:#052e16}
.tile.ye{background:var(--y);border-color:var(--y);color:#2a1f00}
.tile.mm{background:var(--x);border-color:var(--x);color:#fff}
.tile.rv{background:var(--pur);border-color:var(--pur);color:#1a0f3a}
#winbox{margin:0 0 10px}
#winbox:empty,#msg:empty{display:none}
.hist{display:flex;flex-direction:column;gap:5px;margin:5px 0 0}
#msg{min-height:0;font-weight:600;margin:0 0 8px}
.acts{margin:12px 0 0}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:2px solid var(--mute);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.win{background:var(--pur);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:pop .5s ease-out;word-break:break-word}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
.padwrap{position:relative}
#kbd{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;font-size:16px;background:transparent;color:transparent;caret-color:transparent;z-index:2}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (min-width:800px){
:root{--cap:64px}
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
.lg{font-size:21px;padding:14px;gap:14px}
.lg b{font-size:24px}
.abc{gap:6px}
.k{height:54px}
.row,.hist{gap:8px}
.hist{margin-top:8px}
.tile{--s:min(var(--cap,40px),calc((100vw - 48px - (var(--n) - 1) * 8px) / var(--n)))}
.win{font-size:30px;max-width:620px}
button{padding:14px 30px}
}
</style>
</head>
<body>
<main>
<h1>Word Tangle</h1>
<p class="sub">Some colors lie and there is one lie in every row!</p>
<div class="lg"><div style="border-color:var(--g)"><b>Green</b>right spot</div><div style="border-color:var(--y)"><b>Yellow</b>wrong spot</div><div style="border-color:var(--x)"><b>Gray</b>not in the word</div></div>
<div class="panel"><div class="abc" id="abc" aria-label="Alphabet"></div></div>
<div id="winbox"></div>
<div id="msg" role="status" aria-live="polite"></div>
<div class="padwrap"><div class="row" id="pat"></div><input id="kbd" type="text" inputmode="text" enterkeyhint="done" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Type your word"></div>
<div class="hist" id="hist"></div>
<div class="row acts"><button id="new">New game</button><button id="giveup">Give up</button></div>
</main>
<script>
var W=[],ALL={},SET={},BY={};
function getList(url){return fetch(url).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){return t.split(/\s+/).filter(Boolean)})}
function plural(w){if(w.slice(-1)!=="S")return false;if(ALL[w.slice(0,-1)])return true;if(/ES$/.test(w)&&ALL[w.slice(0,-2)])return true;if(/IES$/.test(w)&&ALL[w.slice(0,-3)+"Y"])return true;return false}
function prep(a,g){var u={};a.forEach(function(w){u[w]=1});W=Object.keys(u);ALL={};SET={};BY={};
 W.concat(g).forEach(function(w){if(/^[A-Z]+$/.test(w)&&w.length>=3&&w.length<=7&&/[AEIOUY]/.test(w))ALL[w]=1});
 Object.keys(ALL).forEach(function(w){if(!plural(w))SET[w]=1});
 W.forEach(function(w){if(SET[w]&&w.length<=7)(BY[w.length]=BY[w.length]||[]).push(w)})}
var A="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
function $(i){return document.getElementById(i)}
var COL={R:"gr",M:"ye",A:"mm"};
var done=false,gaveUp=false,target="",g=[],hist=[],used={};
function tstate(w,t){var r=[],c={},i;
for(i=0;i<t.length;i++)c[t[i]]=(c[t[i]]||0)+1;
for(i=0;i<w.length;i++){if(w[i]===t[i]){r[i]="R";c[w[i]]--}}
for(i=0;i<w.length;i++){if(!r[i]){if(c[w[i]]>0){r[i]="M";c[w[i]]--}else r[i]="A"}}return r}
function nl(n){return 1}
function shown(st){var t=st.map(function(s){return COL[s]}),idx=[],i,cs=["gr","ye","mm"];
for(i=0;i<st.length;i++)idx.push(i);
for(i=idx.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=idx[i];idx[i]=idx[j];idx[j]=x}
idx.slice(0,nl(st.length)).forEach(function(k){var o=cs.filter(function(c){return c!==t[k]});t[k]=o[Math.floor(Math.random()*2)]});return t}
function fits(w){for(var k=0;k<hist.length;k++){var h=hist[k];if(h.rv)continue;var st=tstate(h.w,w),d=0;for(var i=0;i<st.length;i++)if(COL[st[i]]!==h.r[i])d++;if(d!==nl(w.length))return false}return true}
function buildAbc(){var a=$("abc");a.innerHTML="";A.forEach(function(l){var b=document.createElement("div");b.className="k"+(used[l]?" us":"");b.textContent=l;a.appendChild(b)})}
function hrow(h){var r=document.createElement("div");r.className="row";
h.w.split("").forEach(function(l,i){var d=document.createElement("div");d.className="tile "+(h.rv?"rv":h.r[i]);d.textContent=l;r.appendChild(d)});return r}
function draw(){
var p=$("pat");p.innerHTML="";
for(var i=0;i<target.length;i++){var d=document.createElement("div"),cu=!done&&i===g.length;
d.className="tile"+(cu?" cur":"");d.textContent=g[i]||"";p.appendChild(d)}
p.style.display=done?"none":"flex";
$("hist").innerHTML="";hist.slice().reverse().forEach(function(h){$("hist").appendChild(hrow(h))});
buildAbc();var kk=$("kbd");if(kk&&kk.value!==g.join(""))kk.value=g.join("")}
function load(){var L=3+Math.floor(Math.random()*5),pool=BY[L];
target=pool[Math.floor(Math.random()*pool.length)];
document.documentElement.style.setProperty("--n",target.length);
hist=[];g=[];used={};done=false;gaveUp=false;
$("msg").textContent="";$("winbox").innerHTML="";draw()}
function add(l){if(done)return;if(g.length>=target.length)g=[];g.push(l);$("msg").textContent="";draw();if(g.length===target.length)check()}
function del(){if(done)return;g.pop();draw()}
function check(){
var w=g.join("");
if(!SET[w]){$("msg").textContent=w+" is not valid.";return}
if(!fits(w)){$("msg").textContent=w+" does not fit the tiles.";return}
hist.push({w:w,r:shown(tstate(w,target))});
w.split("").forEach(function(l){used[l]=1});g=[];
if(w===target){done=true;draw();popup();confetti();return}
draw();$("msg").textContent=""}
var winner="";
function popup(){var nm=winner;try{nm=nm||(new URLSearchParams(location.search).get("name")||window.playerName||"").trim().slice(0,30)}catch(e){}
var d=document.createElement("div");d.className="win";d.textContent=(nm||"Player")+" won with \u2018"+target.toUpperCase()+"\u2019";$("msg").textContent="";var m=$("winbox");m.innerHTML="";m.appendChild(d);
var r=hist;setTimeout(function(){if(done&&hist===r&&!gaveUp)load()},6000)}
function remote(word,name){if(done)return;word=String(word||"").trim().toUpperCase();if(!/^[A-Z]+$/.test(word)||word.length!==target.length)return;g=word.split("");winner=String(name||"").trim().slice(0,30);check();winner=""}
window.submitGuess=remote;
window.addEventListener("message",function(e){var d=e.data;if(d&&d.type==="guess")remote(d.word,d.name)});
var LIVE=/[?&]live=1/.test(location.search)||location.protocol==="file:";
function tikfinity(){var ws;try{ws=new WebSocket("ws://127.0.0.1:21213/")}catch(e){return}
ws.onmessage=function(ev){try{var m=JSON.parse(ev.data),d=m.data||m;if(!/chat|comment/i.test(String(m.event||m.type||"")))return;var u=d.user||{};remote(d.comment||d.text||d.message,d.nickname||d.uniqueId||u.nickname||u.uniqueId)}catch(e){}};
ws.onclose=function(){setTimeout(tikfinity,3000)};ws.onerror=function(){ws.close()}}
if(LIVE)tikfinity();
function giveUp(){
if(done)return;done=true;gaveUp=true;g=[];hist.push({w:target,rv:true,r:[]});draw();
$("msg").textContent="Gave up. The answer was "+target+"."}
function confetti(){
if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
let t=0;
(function f(){
x.clearRect(0,0,c.width,c.height);t++;
ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
if(t<160)requestAnimationFrame(f);else c.remove();
})();
}
$("new").onclick=function(){load();fk()};$("giveup").onclick=function(){giveUp();fk()};
var kb=$("kbd");
function fk(){try{kb.focus({preventScroll:true})}catch(e){}}
document.addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;if(document.activeElement!==kb&&(/^[a-zA-Z]$/.test(e.key)||e.key==="Backspace"))fk()});
kb.addEventListener("input",function(){
if(done){kb.value="";return}
var n=target.length,v=kb.value.toUpperCase().replace(/[^A-Z]/g,"");
if(v.length>n)v=v.slice(n);
g=v.split("");$("msg").textContent="";draw();if(g.length===n)check()});
window.addEventListener("focus",fk);
fk();
$("msg").textContent="Loading words...";
Promise.all([getList("../answers.txt"),getList("../guesses.txt")]).then(function(r){prep(r[0],r[1]);load()}).catch(function(){$("msg").textContent="Could not load the word lists."});
</script>
<script src="../back-to-menu.js"></script>
<script src="live-comments.js"></script></body>
</html>
