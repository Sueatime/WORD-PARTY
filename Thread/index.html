<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Thread</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
<style>
:root{--h:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--mute:hsl(var(--h) 20% 68%);--pur:hsl(var(--h) 70% 68%);--g:#22c55e;--y:#eab308;--x:hsl(var(--h) 14% 42%);--gap:5px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center;display:flex;flex-direction:column;min-height:100vh}
h1{margin:0 0 8px;font-family:"Rubik Doodle Shadow","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9.5vw,44px);letter-spacing:1px;line-height:1.1}
.sub{margin:0 0 12px;color:var(--mute);font-size:18px;text-align:center}
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:15.5px;margin:0 0 10px;text-align:center;color:var(--mute);background:var(--panel);padding:10px;border-radius:12px;line-height:1.3}
.lg div{border-top:4px solid;padding-top:6px}
.lg b{display:block;color:var(--ink);font-size:17px}
.panel{width:100%;margin:0 auto 12px}
.legend{display:flex;gap:6px 14px;font-size:15.5px;margin:0 0 12px;flex-wrap:wrap;justify-content:center;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:5px}
.abc{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.k{border:2px solid transparent;border-radius:8px;height:36px;font:inherit;font-weight:700;color:var(--ink);background:var(--panel);cursor:pointer;padding:0}
.k:active{transform:scale(.92)}
.k.gr{background:var(--g);border-color:var(--g);color:#052e16}
.k.ye{background:var(--y);border-color:var(--y);color:#2a1f00}
.k.mm{background:var(--x);border-color:var(--x);color:#fff}
.row{display:flex;gap:var(--gap);justify-content:center;margin-bottom:5px;align-items:center}
.tile{--s:min(var(--cap,44px),calc((100vw - 48px - (var(--n) - 1) * var(--gap)) / var(--n)));width:var(--s);height:var(--s);border:2px solid var(--mute);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s) * .5);font-weight:700;text-transform:uppercase;color:var(--ink);background:var(--panel);padding:0;border-radius:8px}
.tile.cur{border-color:var(--pur)}
.tile.gr{background:var(--g);border-color:var(--g);color:#052e16}
.tile.ye{background:var(--y);border-color:var(--y);color:#2a1f00}
.tile.mm{background:var(--x);border-color:var(--x);color:#fff}
.tile.jl{margin-left:calc(var(--gap) * -1);border-top-left-radius:0;border-bottom-left-radius:0}
.tile.jr{border-top-right-radius:0;border-bottom-right-radius:0}
.tile.rl{border-top-left-radius:999px;border-bottom-left-radius:999px}
.tile.rr{border-top-right-radius:999px;border-bottom-right-radius:999px}
#winbox{margin:0 0 10px}
#winbox:empty,#msg:empty{display:none}
.hist{display:flex;flex-direction:column;gap:5px;margin:5px 0 0}
#msg{min-height:0;font-weight:600;margin:0 0 8px}
.acts{margin:12px 0 0}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:2px solid var(--mute);background:transparent;color:var(--ink);cursor:pointer}
button.k{padding:0;font-weight:700}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.win{background:var(--pur);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:pop .5s ease-out;word-break:break-word}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
#kbd{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (min-width:800px){
:root{--cap:70px;--gap:8px}
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
.lg{font-size:21px;padding:14px;gap:14px}
.lg b{font-size:24px}
.legend{font-size:21px;gap:8px 20px}
.abc{gap:6px}
.k{height:54px}
.hist{margin-top:8px}
.win{font-size:30px;max-width:620px}
button{padding:14px 30px}
button.k{padding:0}
}
</style>
</head>
<body>
<main>
<h1>Word Thread</h1>
<p class="sub">Joined green letters sit together in the answer. A curved end means the word starts or ends there.</p>
<div class="lg"><div style="border-color:var(--g)"><b>Green</b>right order</div><div style="border-color:var(--y)"><b>Yellow</b>wrong order</div><div style="border-color:var(--x)"><b>Gray</b>not in the word</div></div>
<div class="panel"><div class="abc" id="abc" aria-label="Alphabet"></div></div>
<div id="winbox"></div>
<div id="msg" role="status" aria-live="polite"></div>
<div class="row" id="pat"></div>
<div class="hist" id="hist"></div>
<div class="row acts"><button id="new">New game</button><button id="giveup">Give up</button></div>
</main>
<input id="kbd" type="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Type your word">
<script>
var $=function(i){return document.getElementById(i)};
var A="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),W=[],SET={},W2="ACCOMPLISHMENT ADVENTURE ARCHITECTURE BASKETBALL BEAUTIFUL BREAKTHROUGH BUTTERFLY CAPTIVATING CELEBRATE CELEBRATION CHARACTERISTIC CHOCOLATE CHRISTMAS COMMUNICATION COMMUNITY CONGRATULATIONS CONSTELLATION CROCODILE DANGEROUS DETERMINATION DICTIONARY DINOSAURS ENCOURAGE ENTREPRENEUR ENVIRONMENT EVERYBODY EXCELLENT EXPERIENCE EXTRAORDINARY FAVOURITE FIREWORKS FRIENDSHIP GENERATION GRANDFATHER GRANDMOTHER GREENHOUSE HANDWRITING HAPPINESS HEADQUARTERS HELICOPTER HORSEPOWER IMAGINATION IMPORTANT INFORMATION INTELLIGENT INTERESTING INTERNATIONAL INVESTIGATION KNOWLEDGE LABORATORY LANDSCAPE LIGHTHOUSE MAGNIFICENT MASTERPIECE MICROSCOPE MOTORCYCLE MULTIPLICATION NEIGHBORHOOD NIGHTINGALE OPPORTUNITY OVERWHELMING PAINTBRUSH PHOTOGRAPHER PLAYGROUND POPULATION PROFESSOR PRONUNCIATION REFRIGERATOR RELATIONSHIP REPRESENTATIVE RESPONSIBILITY RESPONSIBLE RESTAURANT SATISFACTION SCOREBOARD SKATEBOARD SPACESHIP STRAWBERRY SUBMARINE SUPERMARKET SURPRISING SYMPATHETIC TELEVISION TEMPERATURE THUNDERSTORM TOOTHBRUSH TRADITIONAL TRANSPORTATION UNDERSTAND UNDERSTANDING UNFORGETTABLE UNIVERSITY VEGETABLES VOLCANOES WATERFALL WATERMELON WHEELCHAIR WONDERFUL".split(" ");
function getList(url){return fetch(url).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){return t.split(/\s+/).filter(Boolean)})}
function prep(a,g){W=a.filter(function(w){return w.length>=3&&w.length<=8});
 g.forEach(function(w){if(w.length<=15)SET[w]=1});W.forEach(function(w){SET[w]=1});W2.forEach(function(w){SET[w]=1})}
var target,g=[],hist=[],ks={},done=false,gaveUp=false,winner="";
function score(w){var n=w.length,m=target.length,a=target,L=[],i,j;
for(i=0;i<=n;i++)L.push(new Array(m+1).fill(0));
for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)L[i][j]=w[i]===a[j]?1+L[i+1][j+1]:Math.max(L[i+1][j],L[i][j+1]);
var r=new Array(n).fill("mm"),mt=new Array(n).fill(-1),used=new Array(m).fill(false),c={};i=0;j=0;
while(i<n&&j<m){if(w[i]===a[j]){r[i]="gr";mt[i]=j;used[j]=true;i++;j++}else if(L[i+1][j]>L[i][j+1])i++;else j++}
for(j=0;j<m;j++)if(!used[j])c[a[j]]=(c[a[j]]||0)+1;
for(i=0;i<n;i++)if(r[i]==="mm"&&c[w[i]]>0){r[i]="ye";c[w[i]]--}
return{r:r,mt:mt}}
function buildAbc(){var a=$("abc");a.innerHTML="";A.forEach(function(l){var b=document.createElement("button");b.className="k"+(ks[l]?" "+ks[l]:"");b.textContent=l;b.setAttribute("aria-label","Letter "+l);b.onclick=function(){add(l)};a.appendChild(b)})}
function hrow(h){var r=document.createElement("div"),n=h.w.length,T=target.length;r.className="row";r.style.setProperty("--n",n);
h.w.split("").forEach(function(l,i){var d=document.createElement("div"),c=h.r[i],jl=c==="gr"&&i>0&&h.r[i-1]==="gr"&&h.mt[i]===h.mt[i-1]+1,jr=c==="gr"&&i<n-1&&h.r[i+1]==="gr"&&h.mt[i+1]===h.mt[i]+1;
d.className="tile "+c+(jl?" jl":"")+(jr?" jr":"");
if(c==="gr"){if(!jl&&h.mt[i]===0)d.className+=" rl";if(!jr&&h.mt[i]===T-1)d.className+=" rr"}
d.textContent=l;r.appendChild(d)});return r}
function draw(){
var p=$("pat");p.innerHTML="";p.style.setProperty("--n",Math.max(g.length+1,5));
for(var i=0;i<=g.length;i++){var d=document.createElement("div"),has=i<g.length;
d.className="tile"+(!has&&!done?" cur":"");d.textContent=g[i]||"";p.appendChild(d)}
p.style.display=done?"none":"flex";
$("hist").innerHTML="";hist.slice().reverse().forEach(function(h){$("hist").appendChild(hrow(h))});
buildAbc()}
function load(){
var P=Math.random()<.25?W2:W;target=P[Math.floor(Math.random()*P.length)];
hist=[];g=[];ks={};done=false;gaveUp=false;
$("msg").textContent="";$("winbox").innerHTML="";draw()}
function add(l){if(done)return;if(g.length>=20)return;g.push(l);$("msg").textContent="";draw()}
function del(){if(done)return;g.pop();draw()}
function check(){
if(done)return;var w=g.join("");
if(!w){$("msg").textContent="Type a word first.";return}
for(var k=0;k<w.length;k++)if(ks[w[k]]==="mm"){$("msg").textContent=w+" does not fit the tiles.";return}
if(!SET[w]){$("msg").textContent=w+" is not a valid word.";return}
var s=score(w),rk={mm:1,ye:2,gr:3};
w.split("").forEach(function(l,i){if(!ks[l]||rk[s.r[i]]>rk[ks[l]])ks[l]=s.r[i]});
hist.push({w:w,r:s.r,mt:s.mt});g=[];
if(w===target){done=true;draw();popup();confetti();return}
draw();$("msg").textContent=""}
function popup(){var nm=winner;try{nm=nm||(new URLSearchParams(location.search).get("name")||window.playerName||"").trim().slice(0,30)}catch(e){}
var d=document.createElement("div");d.className="win";d.textContent=(nm||"Player")+" won with \u2018"+target.toUpperCase()+"\u2019";$("msg").textContent="";var m=$("winbox");m.innerHTML="";m.appendChild(d);
var r=hist;setTimeout(function(){if(done&&hist===r&&!gaveUp)load()},6000)}
function remote(word,name){if(done)return;word=String(word||"").trim().toUpperCase();if(!/^[A-Z]+$/.test(word)||word.length>20)return;g=word.split("");winner=String(name||"").trim().slice(0,30);check();winner=""}
window.submitGuess=remote;
window.addEventListener("message",function(e){var d=e.data;if(d&&d.type==="guess")remote(d.word,d.name)});
function giveUp(){
if(done)return;done=true;gaveUp=true;g=[];
hist.push({w:target,r:target.split("").map(function(){return"gr"}),mt:target.split("").map(function(_,i){return i})});draw();
$("msg").textContent="Gave up. The answer was "+target+"."}
function confetti(){
if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
let t=0;
(function f(){
x.clearRect(0,0,c.width,c.height);t++;
ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
if(t<160)requestAnimationFrame(f);else c.remove();
})();
}
$("new").onclick=load;$("giveup").onclick=giveUp;$("pat").onclick=del;
var kb=$("kbd");
function fk(){try{kb.focus({preventScroll:true})}catch(e){}}
document.addEventListener("keydown",function(e){
if(e.ctrlKey||e.metaKey||e.altKey)return;
if(e.key==="Backspace"){e.preventDefault();del()}
else if(e.key==="Enter"&&!e.target.closest("button")){e.preventDefault();check()}
else if(/^[a-zA-Z]$/.test(e.key)){e.preventDefault();add(e.key.toUpperCase())}});
kb.addEventListener("input",function(){var v=kb.value;kb.value="";v.toUpperCase().replace(/[^A-Z]/g,"").split("").forEach(add)});
document.addEventListener("pointerdown",function(e){if(!e.target.closest("button"))fk()});
window.addEventListener("focus",fk);
fk();
$("msg").textContent="Loading words...";
Promise.all([getList("../answers.txt"),getList("../guesses.txt")]).then(function(r){prep(r[0],r[1]);load()}).catch(function(){$("msg").textContent="Could not load the word lists."});
</script>
<script src="../back-to-menu.js"></script>
<script src="live-comments.js"></script></body>
</html>
