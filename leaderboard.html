<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Party Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
<style>
:root{--h:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--muted:hsl(var(--h) 20% 68%);--pur:hsl(var(--h) 70% 68%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:20px;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 6px;font-family:"Rubik Doodle Shadow","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9vw,48px)}
.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
button,a.back{font:inherit;font-weight:600;cursor:pointer;padding:8px 18px;border-radius:8px;background:transparent;color:var(--ink);border:2px solid var(--muted);text-decoration:none}
button.on{background:var(--pur);border-color:var(--pur);color:#1a1033}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:12px 16px;margin-bottom:8px;text-align:left}
.rank{width:42px;font-weight:700;font-size:22px;text-align:center}
.name{flex:1;font-weight:600;word-break:break-all}
.name small{display:block;color:var(--muted);font-weight:400;font-size:15px}
.pts{font-weight:700;color:var(--pur);font-size:22px}
.empty{color:var(--muted);padding:24px}
a.back{position:fixed;left:10px;top:10px;font-size:15px;padding:6px 12px}
</style>
</head>
<body>
<a class="back" href="./">&larr; Menu</a>
<main>
<h1>Leaderboard</h1>
<p class="sub" id="sub"></p>
<div class="tabs"><button id="pts" class="on">Points</button><button id="wns">Wins</button><button id="gms">By game</button></div>
<div class="tabs"><button id="cur" class="on">This month</button><button id="prev">Last month</button></div>
<div id="list"></div>
</main>
<script>
var URL_="https://igezympgwgxgqaqnuhqo.supabase.co";
var KEY="sb_publishable_Vf0-TBuyjmtifEFAzF7row_HuK9PAnS";
var kind="points",offset=0;
function month(o){var d=new Date(Date.now()+8*3600000);d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+o);return d.toISOString().slice(0,7)}
function show(){
  var m=month(offset),list=document.getElementById("list");
  var cfg={
    points:{view:"leaderboard",col:"total",q:"&order=total.desc&limit=10&select=viewer_name,total",title:"Top 10 points"},
    wins:{view:"leaderboard_wins",col:"wins",q:"&order=wins.desc&limit=10&select=viewer_name,wins",title:"Top 10 wins"},
    games:{view:"leaderboard_by_game",col:"total",q:"&order=game.asc&select=game,viewer_name,total",title:"Top scorer for each game"}
  }[kind];
  document.getElementById("pts").className=kind==="points"?"on":"";
  document.getElementById("wns").className=kind==="wins"?"on":"";
  document.getElementById("gms").className=kind==="games"?"on":"";
  document.getElementById("cur").className=offset===0?"on":"";
  document.getElementById("prev").className=offset===0?"":"on";
  document.getElementById("sub").textContent=cfg.title+" for "+m;
  list.innerHTML='<div class="empty">Loading...</div>';
  fetch(URL_+"/rest/v1/"+cfg.view+"?month=eq."+m+cfg.q,{headers:{apikey:KEY}})
   .then(function(r){return r.json()})
   .then(function(rows){
     list.innerHTML="";
     if(!Array.isArray(rows)||!rows.length){list.innerHTML='<div class="empty">No scores yet.</div>';return}
     var medals=["\uD83E\uDD47","\uD83E\uDD48","\uD83E\uDD49"];
     rows.forEach(function(r,i){
       var d=document.createElement("div");d.className="row";
       var a=document.createElement("div");a.className="rank";
       a.textContent=kind==="games"?"\uD83C\uDFC6":(medals[i]||String(i+1));
       var b=document.createElement("div");b.className="name";
       if(kind==="games"){
         b.textContent=r.game;
         var s=document.createElement("small");s.textContent=r.viewer_name;b.appendChild(s);
       }else{b.textContent=r.viewer_name}
       var c=document.createElement("div");c.className="pts";c.textContent=r[cfg.col];
       d.appendChild(a);d.appendChild(b);d.appendChild(c);list.appendChild(d);
     });
   })
   .catch(function(){list.innerHTML='<div class="empty">Could not load scores.</div>'});
}
document.getElementById("pts").onclick=function(){kind="points";show()};
document.getElementById("wns").onclick=function(){kind="wins";show()};
document.getElementById("gms").onclick=function(){kind="games";show()};
document.getElementById("cur").onclick=function(){offset=0;show()};
document.getElementById("prev").onclick=function(){offset=-1;show()};
show();
</script>
</body>
</html>
